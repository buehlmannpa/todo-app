# Ruft den Endpunkt auf, der faellige Aufgaben meldet.
#
# Der Workflow schlaegt bewusst nie fehl. Ist er nicht eingerichtet oder
# antwortet die App nicht, wird das im Protokoll als Hinweis vermerkt und
# der Lauf endet trotzdem erfolgreich. So verschickt GitHub keine
# Fehlermails im Minutentakt.
#
# Einrichten: unter Settings, Secrets and variables, Actions zwei Secrets
# anlegen. Ohne diese beiden Werte tut der Workflow nichts.
#   APP_URL      die Adresse der App, zum Beispiel https://klar.vercel.app
#   CRON_SECRET  derselbe Wert wie in den Umgebungsvariablen auf Vercel

name: Erinnerungen pruefen

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Endpunkt aufrufen
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -u

          APP_URL="${APP_URL:-}"
          CRON_SECRET="${CRON_SECRET:-}"

          if [ -z "${APP_URL}" ]; then
            echo "::notice::Der Workflow ist nicht eingerichtet. Sobald die Secrets APP_URL und CRON_SECRET gesetzt sind, meldet er faellige Aufgaben."
            echo "Nichts zu tun, das Secret APP_URL fehlt."
            exit 0
          fi

          status=$(curl --silent --show-error --max-time 30 \
            --output antwort.json --write-out "%{http_code}" \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/reminders") || status="000"

          echo "HTTP ${status}"
          [ -f antwort.json ] && head -c 500 antwort.json
          echo

          if [ "${status}" != "200" ]; then
            echo "::warning::Der Endpunkt hat mit HTTP ${status} geantwortet. Der Lauf wird nicht als Fehler gewertet."
          fi
